    <!-- Structured Data - FAQPage for better snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "What is Fusion?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fusion is the platform. APC is the cryptographic engine that powers it. Together, they sign audio at upload and produce receipts anyone can verify, even offline."
          }
        },
        {
          "@type": "Question",
          "name": "How does Fusion work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "APC hashes the audio, signs the hash with an Ed25519 key tied to the publisher, and embeds a watermark in the file itself. The signed receipt can be checked by anyone with the publisher's public key, no Fusion login required."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Fusion for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Newsrooms that need to attribute recordings, voice actors and studios that want to protect their voices, and platforms that want to rank uploads by provenance at ingest."
          }
        }
      ]
    }
    </script>
